services:
  # --- Web : bundle statique servi par nginx sur http://localhost:8080 ---
  # docker compose up web
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: serve
    image: alchimiste-de-brume
    ports:
      - '8080:80'
    restart: unless-stopped

  # --- Développement : vite avec rechargement à chaud sur http://localhost:5173 ---
  # docker compose --profile dev up dev
  # Écoute sur 0.0.0.0 : l'URL est aussi ouvrable depuis un téléphone du même réseau.
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      # node_modules reste dans le conteneur : les binaires natifs de l'hôte ne
      # sont pas forcément compatibles avec Alpine.
      - devmodules:/app/node_modules
    profiles: ['dev']

  # --- Android : dépose out/app-debug.apk puis s'arrête ---
  # docker compose --profile android run --rm android
  android:
    build:
      context: .
      dockerfile: docker/android.Dockerfile
      target: android
    image: alchimiste-de-brume-android
    command: sh -c "cp android/app/build/outputs/apk/debug/app-debug.apk /out/ && echo 'APK dans ./out/app-debug.apk'"
    volumes:
      - ./out:/out
    profiles: ['android']

  # --- iOS : dépose out/ios/ à ouvrir dans Xcode sur un Mac ---
  # docker compose --profile ios run --rm ios
  # La compilation iOS elle-même est impossible en conteneur (Xcode, macOS).
  ios:
    build:
      context: .
      dockerfile: docker/ios.Dockerfile
      target: build
    image: alchimiste-de-brume-ios
    command: sh -c "cp -r ios dist /out/ && echo 'Projet iOS dans ./out/ios — à ouvrir dans Xcode sur un Mac'"
    volumes:
      - ./out:/out
    profiles: ['ios']

volumes:
  devmodules:
