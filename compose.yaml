services:
  # --- Web : bundle statique servi par nginx sur http://localhost:8080 ---
  # docker compose up web
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: serve
    image: alchimiste-de-brume
    ports:
      # Port hôte surchargeable : WEB_PORT=8081 docker compose up web
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped

  # --- Développement : vite avec rechargement à chaud sur http://localhost:5173 ---
  # docker compose --profile dev up dev
  # Écoute sur 0.0.0.0 : l'URL est aussi ouvrable depuis un téléphone du même réseau.
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: alchimiste-de-brume-dev
    ports:
      # Port hôte surchargeable, pour cohabiter avec un vite lancé localement :
      # DEV_PORT=5174 docker compose --profile dev up -d dev
      - '${DEV_PORT:-5173}:5173'
    volumes:
      - .:/app
      # node_modules vient de l'image, pas de l'hôte : les binaires natifs
      # compilés pour la machine ne sont pas compatibles avec Alpine. Docker
      # remplit ce volume nommé depuis l'image à sa première utilisation.
      - devmodules:/app/node_modules
    profiles: ['dev']

  # --- Base de données : PostgreSQL pour les comptes joueurs ---
  # docker compose up -d db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alchimiste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alchimiste}
      POSTGRES_DB: ${POSTGRES_DB:-alchimiste_auth}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-alchimiste} -d ${POSTGRES_DB:-alchimiste_auth}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- API : authentification (login/signup) sur http://localhost:3001 ---
  # docker compose up -d db api
  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: alchimiste-de-brume-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alchimiste}:${POSTGRES_PASSWORD:-alchimiste}@db:5432/${POSTGRES_DB:-alchimiste_auth}
      # Secret de dev uniquement : à surcharger avec une vraie valeur avant
      # tout déploiement réel (JWT_SECRET=... docker compose up -d api).
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - '${API_PORT:-3001}:3001'
    restart: unless-stopped

  # --- Android : dépose out/app-debug.apk puis s'arrête ---
  # docker compose --profile android run --rm android
  android:
    build:
      context: .
      dockerfile: docker/android.Dockerfile
      target: android
    image: alchimiste-de-brume-android
    command: sh -c "cp android/app/build/outputs/apk/debug/app-debug.apk /out/ && echo 'APK dans ./out/app-debug.apk'"
    volumes:
      - ./out:/out
    profiles: ['android']

  # --- iOS : dépose out/ios/ à ouvrir dans Xcode sur un Mac ---
  # docker compose --profile ios run --rm ios
  # La compilation iOS elle-même est impossible en conteneur (Xcode, macOS).
  ios:
    build:
      context: .
      dockerfile: docker/ios.Dockerfile
      target: build
    image: alchimiste-de-brume-ios
    command: sh -c "cp -r ios dist /out/ && echo 'Projet iOS dans ./out/ios — à ouvrir dans Xcode sur un Mac'"
    volumes:
      - ./out:/out
    profiles: ['ios']

volumes:
  devmodules:
  postgres-data:
